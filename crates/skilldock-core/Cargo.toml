[package]
name = "skilldock-core"
description = "Core library for skilldock: the single source of truth for all skill-store operations."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
sha2.workspace = true
glob.workspace = true
dirs.workspace = true
specta = { version = "=2.0.0-rc.25", optional = true, features = ["derive"] }

[features]
# Derive `specta::Type` on the GUI-surfaced public types so they carry across
# the Tauri IPC boundary (ADR-0004). Off by default: the CLI/core stay pure.
specta = ["dep:specta"]

[dev-dependencies]
tempfile.workspace = true
