[workspace]
resolver = "2"
members = ["crates/skilldock-core", "crates/skilldock-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Jiafei Peng <jiafeipeng92@gmail.com>"]
repository = "https://github.com/lunaelf/skilldock"

[workspace.dependencies]
skilldock-core = { path = "crates/skilldock-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
dirs = "5"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tempfile = "3"
